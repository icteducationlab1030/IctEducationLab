<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICT教育ラボ</title>
    <meta
      name="description"
      content="ICT教育ラボは、学びと創造を楽しむコミュニティです。イベント、活動記録、作品、メンバー紹介などを更新しています。"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="ICT教育ラボ ホーム">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>ICT教育ラボ</span>
      </a>
    </header>

    <main class="home-main">
      <section class="hero" aria-label="メインヒーロー">
        <div class="balloon-field" aria-hidden="true"></div>
        <div class="hero-copy">
          <p class="eyebrow">Learning × Creating × Connecting</p>
          <div class="lab-logo" aria-label="ICT教育ラボ">
            <span class="char">I</span>
            <span class="char">C</span>
            <span class="char">T</span>
            <span class="char">教</span>
            <span class="char">育</span>
            <span class="char">ラ</span>
            <span class="char">ボ</span>
          </div>
        </div>

        <div class="hero-side">
          <div class="lab-buddy" aria-hidden="true">
            <span class="buddy-eye left"></span>
            <span class="buddy-eye right"></span>
            <span class="buddy-smile"></span>
          </div>
        </div>
      </section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
